<div class="container">
    <form [formGroup]="form" (ngSubmit)="submit()" ngNativeValidate>
        <div class="input-field">
            <label for="name">Subject<span class="imp">*</span></label>
            <input type="text" formControlName="subject" required>
        </div>
        <div class="input-field">
            <label for="name">Description<span class="imp">*</span></label>
            <textarea type="text" formControlName="description" style="height: 100px;" required></textarea>
        </div>
        <div class="action-btns">
            <button type="submit">Submit</button>
            <button type="button" (click)="close()">Cancel</button>
        </div>
    </form>
</div>
