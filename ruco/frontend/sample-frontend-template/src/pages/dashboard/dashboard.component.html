<div class="container">
  <div class="row">
    @for (item of items; track $index) {
    <div matRipple class="card" [ngClass]="item.gradient" (click)="navigate(item.route)">
      <div class="card-body">
        <h3 class="card-title text-white">{{ item.label }}</h3>
        <div class="d-inline-block">
          <h2 class="text-white">{{ item.count }}</h2>
        </div>
        <span class="float-right display-5 opacity-5"><img class="dicon" [src]="item.imgUrl"></span>
      </div>
    </div>
    }
  </div>
</div>
