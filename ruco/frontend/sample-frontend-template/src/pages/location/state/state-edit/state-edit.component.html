<div class="container">
    <div class="header">Edit State</div>
    <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="on" ngNativeValidate>
        <div class="input-field">
            <label>State<span class="imp">*</span></label>
            <input type="text" formControlName="stateName" required style="width: 350px;">
        </div>
        <div class="action-btns">
            <button type="submit">Update</button>
            <button type="button" (click)="cancel()">Cancel</button>
        </div>
    </form>
</div>
