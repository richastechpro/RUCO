<div class="container">
    <div class="header">Add City</div>
    <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="on" ngNativeValidate>
        <div class="input-field">
            <label>State<span class="imp">*</span></label>
            <input type="text" placeholder="Select State" formControlName="state" [matAutocomplete]="auto1" required style="width: 350px;">
            <mat-autocomplete #auto1="matAutocomplete" [displayWith]="displayStateFn"
                (optionSelected)="onSelectState($event)">
                <mat-option *ngFor="let state of filteredStates | async" [value]="state">
                    {{ state.stateName }}
                </mat-option>
            </mat-autocomplete>
        </div>
        <div class="input-field">
            <label>City<span class="imp">*</span></label>
            <input type="text" formControlName="cityName" required style="width: 350px;">
        </div>
        <div class="action-btns">
            <button type="submit">Submit</button>
            <button type="button" (click)="cancel()">Cancel</button>
        </div>
    </form>
</div>
