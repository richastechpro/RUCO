<div class="container">
    <div class="header">Create Bulk Collection</div>
    <div class="add-btn">
        <div style="display: flex;align-items: center;">
            <div class="input-field">
                <label>Enter Collection Name<span class="imp">*</span></label>
                <input type="text" style="width: 205px;" required [(ngModel)]="collectionName">
            </div>
            @if(isSuperAdmin()){
            <div class="input-field" style="margin-left: 25px; width: 250px;">
                <label>Branch<span class="imp">*</span></label>
                <select (change)="onSelectRow($event)">
                    @for (branch of branches; track branch) {
                    <option [id]="branch.id" [value]="branch.id">{{ branch.branchName }}</option>
                    }
                </select>
            </div>
            }
        </div>
        <div>
            <div class="actn-btns">
                <button type="button" (click)="addItem()">Add</button>
            </div>
        </div>
    </div>
    <br>
    <div class="data">
        <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="on" ngNativeValidate>
            <div class="input-field"></div>
            <ng-container formArrayName="items">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>FBO Name</th>
                            <th>Date</th>
                            <th>Tentative Qty.</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                            <td>{{ i + 1 }}.</td>
                            <td>
                                <div class="input-field">
                                    <input type="text" placeholder="Select FBO" formControlName="fboBranch"
                                        [matAutocomplete]="auto" required>
                                    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFboBranchFn">
                                        <mat-option *ngFor="let branch of filteredFboBranches[i] | async" [value]="branch">
                                            {{ branch.fboBranchName }}
                                        </mat-option>
                                    </mat-autocomplete>
                                </div>
                            </td>
                            <td>
                                <div class="input-field">
                                    <input type="date" style="width: 125px;" formControlName="requestDate" required>
                                </div>
                            </td>
                            <td>
                                <div class="input-field">
                                    <input type="number" style="width: 100px;" formControlName="qty" required>
                                </div>
                            </td>
                            <td>
                                <div class="input-field">
                                    <textarea formControlName="description" required></textarea>
                                </div>
                            </td>
                            <td>
                                <!-- <button type="button" mat-icon-button (click)="editData(i)">
                                    <mat-icon style="color: #76838F;"
                                        fontSet="material-icons-outlined">edit_note</mat-icon>
                                </button> -->
                                <button type="button" mat-icon-button (click)="removeItem(i)">
                                    <mat-icon style="color: #76838F;"
                                        fontSet="material-icons-outlined">delete</mat-icon>
                                </button>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </ng-container>
            <div class="action-btns" style="margin-top: 30px;">
                <button type="submit">Submit</button>
                <button type="button" (click)="cancel()">Cancel</button>
            </div>
        </form>
    </div>

</div>
