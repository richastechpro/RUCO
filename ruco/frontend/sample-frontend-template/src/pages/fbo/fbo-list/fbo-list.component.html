<div class="breadcrumb">
    <div class="title">FBO List</div>
    <div class="routes">
        <button type="button" (click)="add()">Add FBO</button>
    </div>
</div>
<div class="container">
    <header>
        <div class="center">
            <select (change)="onSelectRow($event)">
                @for (row of rows; track row) {
                <option [selected]="row === limit()" [value]="row">{{ row }}</option>
                }
            </select>
        </div>
        <div>
            <div class="input-container">
                <input type="text" placeholder="Enter search term ..." [(ngModel)]="searchTxt" />
                <button mat-icon-button class="search" (click)="search()"
                    [disabled]="!(searchTxt && searchTxt.length)">
                    <mat-icon>search</mat-icon>
                </button>
            </div>
        </div>
    </header>
    <br />
    <div class="data">
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>FBO Name</th>
                    <th>FBO Branches</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>

                @for (item of items; track $index) {
                <tr class="row-data">
                    <td>{{ $index + 1 + offset() * limit() }}.</td>
                    <td>{{ item.fboName }}</td>
                    <td>{{ item.fboBranchesCount }}</td>
                    <td style="width: 200px;">
                        <button class="act-btn" (click)="createLogin(item.id)">Login</button> |
                        <button class="act-btn" (click)="editData(item.id)">Edit</button> |
                        <button class="act-btn" (click)="deleteData(item.id)">Delete</button> 
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
    <div class="paginator">
        @if(items && items.length){
        <app-paginator (page)="navigate($event)" [size]="size()" [records]="records()" [from]="from()"
            [to]="to()"></app-paginator>
        }
        @else {
        <h2>No Data in the table...</h2>
        }
    </div>
</div>
